<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>New Hope Band</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="New Hope Band" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />

    <!-- Fonts: Inter for a clean modern UI + body, JetBrains Mono for chords -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Dark — derived from the logo: cool near-black + periwinkle accent */
        --bg: #0d0e12;
        --bg-grad: #15171f;
        --surface: #15171e;
        --surface-2: #1c1f29;
        --border: #262a36;
        --text: #e9ebf2;
        --muted: #8b91a3;
        --accent: #aab6f7; /* chords: soft periwinkle */
        --accent-dim: #7e8ce0;
        --accent-soft: rgba(143, 156, 240, 0.13);
        --on-accent: #11131c; /* text on an accent-filled surface */
        --chorus: var(--accent-soft);
        --radius: 14px;
        --maxw: 760px;
        --t-fast: 0.12s;
        --t-med: 0.2s;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }
      [data-theme="light"] {
        /* Light — cool off-white + deep indigo accent */
        --bg: #f6f7fb;
        --bg-grad: #eceef6;
        --surface: #ffffff;
        --surface-2: #eef0f6;
        --border: #e3e6ef;
        --text: #1a1c24;
        --muted: #666c7d;
        --accent: #4f46e5; /* chords: indigo */
        --accent-dim: #4338ca;
        --accent-soft: rgba(79, 70, 229, 0.07);
        --on-accent: #ffffff;
        --chorus: var(--accent-soft);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      /* song change / open animations */
      @keyframes songIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes songNext {
        from {
          opacity: 0;
          transform: translateX(26px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes songPrev {
        from {
          opacity: 0;
          transform: translateX(-26px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background:
          radial-gradient(
            120% 80% at 50% -10%,
            var(--bg-grad),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        font-family:
          "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        overscroll-behavior-y: none;
        overflow-x: hidden;
      }
      #app {
        position: relative;
        z-index: 1;
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 18px;
      }

      /* ---------- header ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding-top: env(safe-area-inset-top);
        background: linear-gradient(var(--bg) 75%, transparent);
        backdrop-filter: blur(6px);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0 10px;
      }
      .brand {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: -0.02em;
        margin: 0;
        flex: 1;
        cursor: pointer;
      }
      .iconbtn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 10px;
        font-size: 1.05rem;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }
      .iconbtn:active {
        transform: scale(0.92);
      }
      .iconbtn svg {
        width: 18px;
        height: 18px;
      }

      .search-wrap {
        position: relative;
        padding-bottom: 12px;
      }
      #search {
        width: 100%;
        padding: 12px 14px 12px 40px;
        font-size: 1rem;
        font-family: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
      }
      #search:focus {
        border-color: var(--accent-dim);
      }
      .search-wrap svg {
        position: absolute;
        left: 13px;
        top: 13px;
        opacity: 0.5;
      }

      /* ---------- song list ---------- */
      .count {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 4px 2px 10px;
      }
      ul.list {
        list-style: none;
        margin: 0;
        padding: 0 0 40px;
      }
      ul.list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 12px;
        margin-bottom: 9px;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          border-color 0.15s ease;
      }
      ul.list li:active {
        transform: scale(0.99);
      }
      ul.list li:hover {
        border-color: var(--accent-dim);
      }
      .song-title {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 1.08rem;
        letter-spacing: -0.01em;
        flex: 1;
        min-width: 0; /* let long titles shrink instead of pushing buttons off */
      }
      .song-key {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 0.78rem;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 3px 8px;
        white-space: nowrap;
      }
      .song-langs {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 0.68rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 3px 7px;
        white-space: nowrap;
        letter-spacing: 0.03em;
      }

      /* language tabs (only shown for multi-language songs) */
      .lang-tabs {
        display: flex;
        gap: 8px;
        margin: 0 0 14px;
        flex-wrap: wrap;
      }
      .lang-tab {
        appearance: none;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 7px 16px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        transition: all 0.15s ease;
      }
      .lang-tab:active {
        transform: scale(0.96);
      }
      .lang-tab.active {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 60px 20px;
      }

      /* ---------- song view ---------- */
      .hidden {
        display: none !important;
      }
      .song-header {
        padding: 6px 0 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      /* allow vertical scroll but let JS handle left/right swipes */
      #song-view {
        touch-action: pan-y;
        overflow-x: clip;
      }
      .back {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 16px 0 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition:
          background var(--t-fast) var(--ease),
          transform var(--t-fast) var(--ease);
      }
      .back:active {
        transform: scale(0.95);
        background: var(--surface-2);
      }
      .back svg {
        width: 18px;
        height: 18px;
      }
      .song-view h1 {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 1.75rem;
        margin: 2px 0 6px;
        letter-spacing: -0.02em;
      }
      .keyline {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 14px;
      }
      .keyline b {
        color: var(--accent);
        font-family: "JetBrains Mono", monospace;
      }

      /* ---------- floating controls (FAB bubble + expanding panel) ---------- */
      /* wrap is just the 56px button area; it never blocks the page so swipes
         work everywhere. The panel is absolutely positioned above it. */
      .fab-wrap {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0));
        z-index: 40;
        width: 56px;
        height: 56px;
        pointer-events: none;
      }
      .fab {
        appearance: none;
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        display: grid;
        place-items: center;
        pointer-events: auto;
        transition: transform var(--t-fast) var(--ease);
      }
      .fab:active {
        transform: scale(0.92);
      }
      .fab-wrap.open .fab-ico {
        opacity: 0;
      } /* swap glyph for an × when open */
      .fab-wrap.open .fab::after {
        content: "\00D7";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.8rem;
        line-height: 1;
      }

      /* the panel: absolutely anchored above the button, expands up from it */
      .fab-panel {
        position: absolute;
        right: 0;
        bottom: calc(100% + 10px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(86vw, 320px);
        max-height: 70vh;
        overflow-y: auto;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
        transform-origin: bottom right;
        pointer-events: auto;
        transition:
          transform var(--t-med) var(--ease),
          opacity var(--t-med) var(--ease);
      }
      .fab-wrap:not(.open) .fab-panel {
        opacity: 0;
        transform: scale(0.9) translateY(8px);
        pointer-events: none;
      }
      .fab-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .fab-lbl {
        font-size: 0.64rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        width: 40px;
        flex: none;
      }
      .fbtn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        height: 40px;
        min-width: 40px;
        border-radius: 10px;
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition:
          background var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease),
          border-color var(--t-fast) var(--ease),
          transform var(--t-fast) var(--ease);
      }
      .fbtn svg {
        width: 18px;
        height: 18px;
      }
      .fbtn:active {
        transform: scale(0.94);
      }
      .fbtn.flex {
        flex: 1;
        font-size: 0.95rem;
        font-weight: 600;
        gap: 4px;
      }
      .fbtn:active {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .fbtn.on {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .fpill {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 0.95rem;
        min-width: 44px;
        text-align: center;
        color: var(--accent);
      }
      .fab-panel .lang-tabs,
      .fab-panel .section-chips {
        margin: 0;
      }

      /* lyrics-only mode hides all chord tokens */
      .sheet.lyrics-only .chord {
        display: none;
      }

      /* chord sheet (styles target ChordSheetJS HtmlDivFormatter output) */
      .sheet {
        padding-bottom: 50vh;
        font-size: var(--sheet-size, 1.05rem);
        overflow-x: hidden; /* never scroll sideways on a phone */
      }
      .sheet .chord-sheet {
      }
      .sheet .paragraph {
        margin: 0 0 1.5em;
      }
      /* Chorus: tinted accent card so it stands out at a glance */
      .sheet .paragraph.chorus {
        background: var(--chorus);
        border-left: 3px solid var(--accent);
        padding: 12px 16px;
        border-radius: 10px;
      }
      /* Bridge: quieter left rule to set it apart from verses */
      .sheet .paragraph.bridge {
        border-left: 2px solid var(--border);
        padding: 2px 0 2px 14px;
      }
      .sheet .row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        max-width: 100%;
      }
      .sheet .column {
        display: inline-flex;
        flex-direction: column;
        min-width: 0; /* allow long lyric chunks to wrap instead of overflow */
        max-width: 100%;
      }
      .sheet .chord {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        color: var(--accent);
        font-size: 0.8em;
        line-height: 1.1;
        min-height: 1.2em;
        white-space: pre;
        letter-spacing: -0.02em;
      }
      .sheet .chord:not(:empty) {
        padding-right: 0.35em;
      }
      .sheet .lyrics {
        white-space: pre-wrap; /* keep chord spacing but wrap to fit screen */
        overflow-wrap: anywhere;
        line-height: 1.45;
        min-height: 1.45em; /* empty lyric still reserves a line so a trailing
                               chord stays ABOVE the text, not inline with it */
      }
      /* Section labels ({comment: Verse 1}, Bridge, x2 …) */
      .sheet .comment {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.92em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        margin: 0.2em 0 0.5em;
        scroll-margin-top: 150px; /* land below the sticky control panel */
      }
      .sheet h1.title {
        display: none;
      } /* we render our own title */

      /* Two-column "songbook spread" in landscape — halves the scrolling.
         Verses/choruses stay whole (no splitting across columns). */
      @media (orientation: landscape) and (min-width: 600px) {
        #app {
          max-width: 1100px;
        }
        .sheet {
          padding-bottom: 14vh;
        }
        .sheet .chord-sheet {
          column-count: 2;
          column-gap: 38px;
          column-rule: 1px solid var(--border);
        }
        .sheet .paragraph {
          break-inside: avoid;
        }
      }

      /* section chips — jump to a {comment:} label; scrolls horizontally */
      .section-chips {
        display: flex;
        gap: 6px;
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .section-chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        appearance: none;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.76rem;
        padding: 5px 12px;
        border-radius: 999px;
        white-space: nowrap;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .chip:active {
        background: var(--accent);
        color: var(--on-accent);
      }

      /* add-to-set button on a list row (All view) */
      .row-add {
        appearance: none;
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        transition: transform 0.08s ease;
      }
      .row-add.in {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .row-add:active {
        transform: scale(0.92);
      }
      .row-add svg {
        width: 16px;
        height: 16px;
      }

      /* set-mode row tools: move up / down / remove */
      .row-tools {
        display: inline-flex;
        gap: 5px;
        flex: none;
      }
      .row-drag {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        min-width: 38px;
        height: 32px;
        border-radius: 8px;
        font-size: 1rem;
        letter-spacing: -3px;
        line-height: 1;
        cursor: grab;
        touch-action: none;
      }
      .row-drag:active {
        cursor: grabbing;
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      ul.list li.dragging {
        border-color: var(--accent);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        background: var(--surface-2);
        list-style: none;
      }
      /* dashed gap showing where the dragged row will land */
      .drag-placeholder {
        border: 2px dashed var(--accent) !important;
        background: var(--accent-soft) !important;
        border-radius: 12px;
        margin-bottom: 9px;
        list-style: none;
        box-sizing: border-box;
      }

      /* All / Set segmented control */
      .list-tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0 12px;
      }
      .seg {
        appearance: none;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 7px 14px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .seg.active {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      .seg-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text);
        display: inline-grid;
        place-items: center;
      }
      .seg.active .seg-badge {
        background: rgba(255, 255, 255, 0.25);
        color: var(--on-accent);
      }
      .seg-clear {
        appearance: none;
        cursor: pointer;
        margin-left: auto;
        font-family: "Inter", sans-serif;
        font-size: 0.8rem;
        color: var(--muted);
        background: none;
        border: none;
        padding: 6px 4px;
      }
      .seg-clear:active {
        color: var(--accent);
      }
      /* named-set toolbar (shown in Set tab) */
      .set-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 12px;
      }
      #set-select {
        flex: 1;
        min-width: 0;
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 10px;
        outline: none;
      }
      #set-select:focus {
        border-color: var(--accent-dim);
      }
      .setbtn {
        appearance: none;
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .setbtn:active {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .setbtn svg {
        width: 18px;
        height: 18px;
      }

      /* remove-from-set button on a list row */
      .row-remove {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        flex: none;
      }
      .row-remove:active {
        background: var(--accent);
        color: var(--on-accent);
      }

      /* reading / autoscroll progress bar */
      #progress {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: 0;
        right: 0;
        height: 3px;
        z-index: 50;
        pointer-events: none;
        background: transparent;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.12s linear;
      }
      #progress.scrolling #progress-fill {
        box-shadow: 0 0 8px var(--accent);
      }

      .appfoot {
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        padding: 10px 0 34px;
      }
      .appfoot a {
        color: var(--accent-dim);
        text-decoration: none;
      }
      /* add / edit song overlay */
      html.noscroll,
      html.noscroll body {
        overflow: hidden;
      }
      .editor {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.55);
        display: grid;
        place-items: end center;
        padding: 0;
        overscroll-behavior: contain;
      }
      .editor-card {
        overscroll-behavior: contain;
        width: 100%;
        max-width: var(--maxw);
        max-height: 92vh;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 18px 18px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .editor-head strong {
        font-size: 1.1rem;
      }
      .ed-admin {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .ed-admin .ed-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .ed-admin:has(#ed-logout:not(.hidden)) .ed-dot {
        background: #46c46a;
      }
      .ed-link {
        appearance: none;
        border: none;
        background: none;
        color: var(--accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 4px;
        margin-left: auto;
      }
      .ed-fields {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #ed-name {
        flex: 1 1 100%;
      }
      .editor input[type="text"],
      .editor input:not([type]) {
        flex: 1;
        min-width: 90px;
        font-family: inherit;
        font-size: 1rem;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 12px;
        outline: none;
      }
      .ed-check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .ed-check input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      #ed-text,
      #ed-text2 {
        width: 100%;
        min-height: 40vh;
        resize: vertical;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        outline: none;
        white-space: pre;
      }
      .ed-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ed-btn {
        appearance: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 11px 20px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: var(--on-accent);
      }
      .ed-btn.ghost {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .ed-hint {
        color: var(--muted);
        font-size: 0.78rem;
        margin-left: auto;
      }

      /* print / save-as-PDF: only the current song, in black on white */
      /* margin:0 makes browsers drop the URL/date/page-number header & footer */
      @page {
        margin: 0;
      }
      @media print {
        body {
          background: #fff;
          color: #000;
        }
        #list-view,
        header,
        .fab-wrap,
        #progress,
        .keyline,
        .appfoot,
        .editor {
          display: none !important;
        }
        #app {
          max-width: 100%;
          padding: 12mm 10mm;
        }
        #song-view {
          display: block !important;
        }
        .song-view h1 {
          color: #000;
          margin-top: 0;
        }
        .sheet {
          padding: 0;
          font-size: 10.5pt;
        }
        /* two columns to save paper; keep sections whole */
        .sheet .chord-sheet {
          column-count: 2;
          column-gap: 10mm;
          column-fill: balance;
          orphans: 2;
          widows: 2;
        }
        .sheet .paragraph {
          break-inside: avoid;
        }
        .sheet .chord {
          color: #000;
          font-weight: 700;
        }
        .sheet .comment {
          color: #000;
        }
        .sheet .paragraph.chorus {
          background: #f0f0f0;
          border-left: 3px solid #000;
        }
      }
    </style>
  </head>
  <body>
    <div id="progress" class="hidden"><div id="progress-fill"></div></div>
    <div id="app">
      <!-- LIST VIEW -->
      <div id="list-view">
        <header>
          <div class="bar">
            <h1 class="brand" id="brand">New Hope Band</h1>
            <button class="iconbtn" id="add-btn" title="Add a song" aria-label="Add a song">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <button
              class="iconbtn"
              id="theme-btn"
              title="Toggle theme"
              aria-label="Toggle theme"
            >
              &#9728;
            </button>
          </div>
          <div class="search-wrap">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search title or lyrics&hellip;"
              autocomplete="off"
            />
          </div>
        </header>
        <div class="list-tabs">
          <button class="seg active" id="tab-all">All songs</button>
          <button class="seg" id="tab-set">
            Set <span class="seg-badge" id="set-count">0</span>
          </button>
          <button class="seg-clear hidden" id="set-clear">Clear set</button>
        </div>
        <div class="set-bar hidden" id="set-bar">
          <select id="set-select" aria-label="Choose set"></select>
          <button class="setbtn" id="set-new" title="New set" aria-label="New set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
          <button class="setbtn" id="set-rename" title="Rename set" aria-label="Rename set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
            </svg>
          </button>
          <button class="setbtn" id="set-delete" title="Delete set" aria-label="Delete set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          </button>
          <button class="setbtn" id="set-share" title="Share set" aria-label="Share set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
            </svg>
          </button>
          <button class="setbtn" id="set-import" title="Import set from link" aria-label="Import set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
        </div>
        <div class="count" id="count"></div>
        <ul class="list" id="list"></ul>
        <footer class="appfoot">
          New Hope Band &middot; by Avdey Axonov &middot;
          <a href="LICENSE">MIT&nbsp;License</a>
          &middot; <span id="ver">build 8</span>
        </footer>
      </div>

      <!-- SONG VIEW -->
      <div id="song-view" class="song-view hidden">
        <header>
          <div class="song-header">
            <button class="back" id="back" aria-label="Back to songs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              <span>Songs</span>
            </button>
          </div>
        </header>
        <h1 id="song-title"></h1>
        <div class="keyline" id="keyline"></div>

        <div class="sheet" id="sheet"></div>
      </div>

      <!-- FLOATING CONTROLS (song view only) -->
      <div class="fab-wrap hidden" id="fab-wrap">
        <div class="fab-panel" id="fab-panel">
          <div class="lang-tabs hidden" id="lang-tabs"></div>
          <div class="section-chips hidden" id="section-chips"></div>

          <div class="fab-row">
            <span class="fab-lbl">Key</span>
            <button class="fbtn" id="key-down" aria-label="Transpose down">
              &minus;
            </button>
            <span class="fpill" id="key-now">G</span>
            <button class="fbtn" id="key-up" aria-label="Transpose up">+</button>
            <button
              class="fbtn"
              id="key-reset"
              aria-label="Reset to original key"
              title="Reset to original key"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
            </button>
          </div>

          <div class="fab-row">
            <span class="fab-lbl">Size</span>
            <button class="fbtn" id="size-down" aria-label="Smaller text">
              &minus;
            </button>
            <span class="fpill" id="size-now">100%</span>
            <button class="fbtn" id="size-up" aria-label="Larger text">+</button>
            <button class="fbtn" id="size-reset" aria-label="Reset text size" title="Reset text size">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
            </button>
          </div>

          <div class="fab-row">
            <button
              class="fbtn flex on"
              id="chords-btn"
              aria-label="Show or hide chords"
              title="Chords on/off"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
              <span>Chords</span>
            </button>
            <button
              class="fbtn flex"
              id="set-btn"
              aria-label="Add to set"
              title="Add to set"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              <span>Set</span>
            </button>
          </div>

          <div class="fab-row">
            <span class="fab-lbl">Scroll</span>
            <button class="fbtn" id="scroll-slow" aria-label="Slower">
              &minus;
            </button>
            <button class="fbtn flex" id="scroll-btn" aria-label="Auto-scroll">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="6 4 20 12 6 20" />
              </svg>
            </button>
            <button class="fbtn" id="scroll-fast" aria-label="Faster">+</button>
          </div>

          <div class="fab-row">
            <button class="fbtn flex" id="pdf-btn" aria-label="Save as PDF" title="Save / print this song as PDF">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9V2h12v7" />
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                <rect x="6" y="14" width="12" height="8" />
              </svg>
              <span>Save PDF</span>
            </button>
            <button class="fbtn flex hidden" id="edit-btn" aria-label="Edit this song" title="Edit this song">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
              </svg>
              <span>Edit</span>
            </button>
          </div>
        </div>

        <button class="fab" id="fab" aria-label="Open controls">
          <svg
            class="fab-ico"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5" />
            <circle cx="16" cy="6" r="2" fill="currentColor" />
            <circle cx="8" cy="12" r="2" fill="currentColor" />
            <circle cx="13" cy="18" r="2" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ADD / EDIT SONG OVERLAY -->
    <div id="editor" class="editor hidden">
      <div class="editor-card">
        <div class="editor-head">
          <strong id="editor-title">Add a song</strong>
          <button class="iconbtn" id="ed-close" aria-label="Close">&times;</button>
        </div>
        <div class="ed-admin" id="ed-admin">
          <span class="ed-dot"></span>
          <span id="ed-status">Not signed in</span>
          <button class="ed-link" id="ed-login">Log in</button>
          <button class="ed-link hidden" id="ed-logout">Log out</button>
        </div>
        <div class="ed-fields">
          <input id="ed-name" placeholder="Song title" />
          <input id="ed-key" placeholder="Key (G)" />
          <input id="ed-lang" placeholder="Language (English)" />
          <label class="ed-check"><input type="checkbox" id="ed-german" /> Slavic notation (H = B)</label>
        </div>
        <textarea id="ed-text" spellcheck="false" placeholder="Verse&#10;C       G&#10;lyrics here&#10;&#10;Section name, then chords above the words and lyrics below."></textarea>

        <label class="ed-check"><input type="checkbox" id="ed-biling" /> Add a 2nd language</label>
        <div id="ed-block2" class="hidden">
          <div class="ed-fields">
            <input id="ed-key2" placeholder="Key (A)" />
            <input id="ed-lang2" placeholder="Language (Українською)" />
            <label class="ed-check"><input type="checkbox" id="ed-german2" /> Slavic notation (H = B)</label>
          </div>
          <textarea id="ed-text2" spellcheck="false" placeholder="Verse&#10;C       G&#10;lyrics here&#10;&#10;Section name, then chords above the words and lyrics below."></textarea>
        </div>

        <div class="ed-actions">
          <button class="ed-btn" id="ed-save">Save</button>
          <button class="ed-btn ghost" id="ed-delete">Delete</button>
          <span class="ed-hint">Shared with everyone (admin login required).</span>
        </div>
      </div>
    </div>

    <script src="vendor/chordsheetjs.min.js"></script>
    <script src="convert-core.js"></script>
    <script src="songs.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("service-worker.js"),
        );
      }
    </script>
  </body>
</html>
